<!-- GameMonetize: подписка на события обязана существовать до загрузки sdk.js.
     gameId берётся в кабинете GameMonetize и задаётся ТОЛЬКО здесь. -->
<script>
window.SDK_OPTIONS = {
  gameId: 'on8kj3lxnrhigabsy02l0ynzoalscam8',   /* ID из кабинета GameMonetize */
  onEvent: function (a) {
    try { console.log('[GameMonetize]', a && a.name); } catch (e) {}
    if (window.gmEvent) window.gmEvent(a.name);
  }
};
(function (a, b, c) {
  var d = a.getElementsByTagName(b)[0];
  if (!a.getElementById(c)) {
    a = a.createElement(b); a.id = c;
    a.src = 'https://api.gamemonetize.com/sdk.js';
    d.parentNode.insertBefore(a, d);
  }
})(document, 'script', 'gamemonetize-sdk');
</script>
